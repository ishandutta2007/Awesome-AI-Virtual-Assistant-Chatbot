<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Brand Vibrant Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.22) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 120; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite alternate; transform-origin: 1000px 320px; }
    .pill-anim-1 { animation: floatPill 4.5s ease-in-out infinite alternate; }
    .pill-anim-2 { animation: floatPill 5.2s ease-in-out infinite alternate 0.8s; }
    .pill-anim-3 { animation: floatPill 4.8s ease-in-out infinite alternate 1.6s; }
    .pill-anim-4 { animation: floatPill 5.5s ease-in-out infinite alternate 2.4s; }
    .signal-line { stroke-dasharray: 8 6; animation: waveFlow 4s linear infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Animated Ambient Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="120" r="140" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="300" r="160" fill="#a855f7" filter="url(#glow)" />
  <circle cx="600" cy="210" r="180" fill="#4338ca" opacity="0.12" filter="url(#glow)" />

  <!-- Dynamic Signal / Wave Graphic (Background Element) -->
  <path class="signal-line" d="M 50 350 Q 300 390 600 340 T 1150 330" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
  <path class="signal-line" d="M 50 365 Q 350 330 650 365 T 1150 345" fill="none" stroke="#c084fc" stroke-width="1.8" opacity="0.25" />

  <!-- Outer Modern Glass Border -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Main Foreground Content Area -->
  <g id="main-foreground" transform="translate(0, 0)">
    
    <!-- Top Category Badge / Pill -->
    <g transform="translate(600, 52)">
      <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="-145" cy="0" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1.5">
        ⚡ AWESOME CURATED DIRECTORY ⚡
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-0.5">
      AI Virtual Assistant &amp; Chatbot
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.2">
      Curated Guide to Enterprise SaaS &amp; Open-Source Conversational AI Systems
    </text>

    <!-- Architectural / Feature Badges (Interactive Pills) -->
    <!-- Pill 1: Enterprise SaaS -->
    <g class="pill-anim-1" transform="translate(180, 240)">
      <rect x="-95" y="-22" width="190" height="44" rx="22" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" />
      <circle cx="-65" cy="0" r="9" fill="#0284c7" />
      <text x="-65" y="4" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle">🏢</text>
      <text x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc" text-anchor="middle">
        Enterprise SaaS
      </text>
    </g>

    <!-- Pill 2: Open-Source Models -->
    <g class="pill-anim-2" transform="translate(460, 240)">
      <rect x="-105" y="-22" width="210" height="44" rx="22" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.4" />
      <circle cx="-75" cy="0" r="9" fill="#6366f1" />
      <text x="-75" y="4" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle">🔓</text>
      <text x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc" text-anchor="middle">
        Open-Source Repos
      </text>
    </g>

    <!-- Pill 3: Autonomous AI Agents -->
    <g class="pill-anim-3" transform="translate(740, 240)">
      <rect x="-100" y="-22" width="200" height="44" rx="22" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.4" />
      <circle cx="-70" cy="0" r="9" fill="#9333ea" />
      <text x="-70" y="4" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle">🤖</text>
      <text x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc" text-anchor="middle">
        Agentic Workflows
      </text>
    </g>

    <!-- Pill 4: Voice & Omnichannel -->
    <g class="pill-anim-4" transform="translate(1020, 240)">
      <rect x="-95" y="-22" width="190" height="44" rx="22" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.4" />
      <circle cx="-65" cy="0" r="9" fill="#0891b2" />
      <text x="-65" y="4" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle">🎙️</text>
      <text x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc" text-anchor="middle">
        Voice &amp; Omnichannel
      </text>
    </g>

    <!-- Bottom Tech Tags / Highlights -->
    <g transform="translate(600, 325)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1">
        NATURAL LANGUAGE PROCESSING • LLM AGENT ROUTING • MULTI-TENANT WORKFLOWS • SELF-HOSTED PRIVACY
      </text>
    </g>

    <g transform="translate(600, 375)">
      <circle cx="-130" cy="-4" r="3" fill="#38bdf8" />
      <text x="-120" y="0" font-family="sans-serif" font-size="12" fill="#94a3b8">Market Sized &amp; Analyzed</text>

      <circle cx="10" cy="-4" r="3" fill="#818cf8" />
      <text x="20" y="0" font-family="sans-serif" font-size="12" fill="#94a3b8">Transparent Pricing &amp; Free Tiers</text>

      <circle cx="170" cy="-4" r="3" fill="#c084fc" />
      <text x="180" y="0" font-family="sans-serif" font-size="12" fill="#94a3b8">GitHub Stars Tracked</text>
    </g>
  </g>
</svg>
